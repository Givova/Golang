<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Центрирование блоков</title>
		<style>
			.outer {
				position: relative;
				height: 300px;
				background-color: #e0e0e0;
			}

			.inner {
				position: absolute;
				inset: 0;
				margin: auto;
				width: 200px;
				height: 100px;
				background-color: #4a90d9;
			}

			.outer1 {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 300px;
				background-color: #e0e0e0;
			}

			.inner1 {
				width: 200px;
				height: 100px;
				background-color: #4a90d9;
			}
		</style>
	</head>
	<body>
		<div class="outer">
			<div class="inner"></div>
		</div>

		<br />
		<div class="outer1">
			<div class="inner1"></div>
		</div>
	</body>
</html>
